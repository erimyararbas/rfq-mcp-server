<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="420" rx="16" fill="#ffffff"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#0f172a">RFQ MCP server — architecture</text>

  <!-- Claude -->
  <rect x="32" y="120" width="170" height="150" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="117" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3412">Claude</text>
  <text x="117" y="184" text-anchor="middle" font-size="12.5" fill="#7c2d12">Desktop / claude.ai</text>
  <text x="117" y="212" text-anchor="middle" font-size="12" fill="#7c2d12">natural-language</text>
  <text x="117" y="228" text-anchor="middle" font-size="12" fill="#7c2d12">requests from</text>
  <text x="117" y="244" text-anchor="middle" font-size="12" fill="#7c2d12">procurement &amp; sales</text>

  <line x1="204" y1="195" x2="262" y2="195" stroke="#475569" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="233" y="185" text-anchor="middle" font-size="11" fill="#475569">MCP</text>
  <text x="233" y="214" text-anchor="middle" font-size="11" fill="#475569">stdio</text>

  <!-- MCP server -->
  <rect x="264" y="76" width="380" height="300" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="284" y="104" font-size="15" font-weight="700" fill="#0f172a">rfq_mcp</text>
  <text x="624" y="104" text-anchor="end" font-size="11.5" fill="#64748b">Python · FastMCP</text>

  <rect x="284" y="120" width="340" height="66" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="300" y="144" font-size="13.5" font-weight="700" fill="#3730a3">19 tools</text>
  <text x="300" y="164" font-size="12" fill="#3730a3">RFQs · supplier search · quote status</text>
  <text x="300" y="179" font-size="12" fill="#3730a3">quote comparison · markup · CSV export</text>

  <rect x="284" y="198" width="340" height="74" rx="10" fill="#fef2f2" stroke="#dc2626"/>
  <text x="300" y="222" font-size="13.5" font-weight="700" fill="#991b1b">Safety layer</text>
  <text x="300" y="242" font-size="12" fill="#991b1b">read-only unless RFQ_ALLOW_WRITE=true</text>
  <text x="300" y="258" font-size="12" fill="#991b1b">e-mailing / irreversible tools need confirm=true</text>

  <rect x="284" y="284" width="340" height="74" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="300" y="308" font-size="13.5" font-weight="700" fill="#065f46">Backend interface</text>
  <text x="300" y="328" font-size="12" fill="#065f46">same tool surface for demo and live data</text>
  <text x="300" y="344" font-size="12" fill="#065f46">so the safety rules are tested once</text>

  <!-- backends -->
  <line x1="646" y1="300" x2="700" y2="160" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="646" y1="330" x2="700" y2="300" stroke="#475569" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="5 4"/>

  <rect x="702" y="108" width="226" height="108" rx="12" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="718" y="134" font-size="14" font-weight="700" fill="#065f46">Demo backend</text>
  <text x="718" y="156" font-size="12" fill="#334155">in-memory, fictional suppliers</text>
  <text x="718" y="173" font-size="12" fill="#334155">e-mails go to an outbox</text>
  <text x="718" y="198" font-size="11.5" font-weight="600" fill="#059669">included in this repo</text>

  <rect x="702" y="244" width="226" height="132" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="718" y="270" font-size="14" font-weight="700" fill="#334155">Live adapter</text>
  <text x="718" y="292" font-size="12" fill="#334155">company RFQ web app (Django)</text>
  <text x="718" y="309" font-size="12" fill="#334155">no public API → session login,</text>
  <text x="718" y="326" font-size="12" fill="#334155">HTML tables/forms → JSON</text>
  <text x="718" y="343" font-size="12" fill="#334155">(helpers in scraping.py)</text>
  <text x="718" y="364" font-size="11.5" font-weight="600" fill="#64748b">private — not published</text>
</svg>
