<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="360" rx="16" fill="#ffffff"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#0f172a">Sales assistant built on top of the MCP</text>
  <text x="32" y="68" font-size="13" fill="#64748b">Work in progress — one screen for non-technical sales staff, Claude does the cross-tool work</text>

  <!-- Sales rep -->
  <rect x="32" y="160" width="140" height="80" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="102" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Sales rep</text>
  <text x="102" y="216" text-anchor="middle" font-size="12" fill="#475569">no code, no prompts</text>

  <line x1="174" y1="200" x2="226" y2="200" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- Artifact -->
  <rect x="228" y="130" width="190" height="140" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="323" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">Claude artifact</text>
  <text x="323" y="190" text-anchor="middle" font-size="12" fill="#3730a3">sales assistant UI</text>
  <text x="323" y="218" text-anchor="middle" font-size="12" fill="#3730a3">buttons &amp; forms that</text>
  <text x="323" y="234" text-anchor="middle" font-size="12" fill="#3730a3">trigger Claude actions</text>

  <line x1="420" y1="200" x2="472" y2="200" stroke="#475569" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- Claude -->
  <rect x="474" y="150" width="130" height="100" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="539" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">Claude</text>
  <text x="539" y="216" text-anchor="middle" font-size="12" fill="#7c2d12">orchestrates</text>

  <!-- connectors -->
  <g font-size="12">
    <line x1="606" y1="180" x2="690" y2="112" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
    <line x1="606" y1="192" x2="690" y2="178" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
    <line x1="606" y1="208" x2="690" y2="244" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
    <line x1="606" y1="220" x2="690" y2="310" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>

    <rect x="692" y="86" width="236" height="52" rx="10" fill="#ffffff" stroke="#dc2626"/>
    <text x="708" y="108" font-size="13.5" font-weight="700" fill="#991b1b">Gmail</text>
    <text x="708" y="126" fill="#475569">customer requests &amp; replies</text>

    <rect x="692" y="152" width="236" height="52" rx="10" fill="#ffffff" stroke="#16a34a"/>
    <text x="708" y="174" font-size="13.5" font-weight="700" fill="#166534">Google Drive</text>
    <text x="708" y="192" fill="#475569">drawings &amp; documents</text>

    <rect x="692" y="218" width="236" height="52" rx="10" fill="#ffffff" stroke="#7c3aed"/>
    <text x="708" y="240" font-size="13.5" font-weight="700" fill="#5b21b6">ClickUp</text>
    <text x="708" y="258" fill="#475569">tasks &amp; follow-ups</text>

    <rect x="692" y="284" width="236" height="52" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="708" y="306" font-size="13.5" font-weight="700" fill="#065f46">RFQ platform (this MCP)</text>
    <text x="708" y="324" fill="#475569">suppliers, RFQs, quote comparison</text>
  </g>
</svg>
